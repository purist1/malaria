data:
  raw_path: "dataset/Malaria_Dataset.csv"
  processed_path: "data/processed/malaria_processed.csv"
  target_column: "target"
  remove_duplicates: true

split:
  test_size: 0.2
  random_state: 42
  stratify: true

models:
  logistic_regression:
    max_iter: 1000
    C: 1.0
    class_weight: "balanced"
  decision_tree:
    max_depth: 8
    min_samples_leaf: 5
    random_state: 42
    class_weight: "balanced"
  random_forest:
    n_estimators: 200
    max_depth: 12
    min_samples_leaf: 3
    random_state: 42
    class_weight: "balanced"
  svm:
    kernel: "rbf"
    C: 1.0
    random_state: 42
    class_weight: "balanced"

artifacts:
  models_dir: "models/"
  reports_dir: "reports/"
  figures_dir: "reports/figures/"

eda:
  figures_dir: "reports/figures/"

dashboard:
  title: "Malaria Occurrence Prediction System"
  default_threshold: 0.5
